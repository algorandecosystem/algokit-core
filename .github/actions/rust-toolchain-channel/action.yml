name: 'Rust Toolchain Channel'
description: 'Reads the Rust toolchain channel from rust-toolchain.toml so CI uses the same version as local development'

outputs:
  channel:
    description: 'The Rust toolchain channel declared in rust-toolchain.toml (e.g. 1.100.0)'
    value: ${{ steps.channel.outputs.channel }}

runs:
  using: 'composite'
  steps:
    - id: channel
      shell: bash
      run: |
        set -euo pipefail
        channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
        if [[ -z "$channel" ]]; then
          echo "Could not read 'channel' from rust-toolchain.toml" >&2
          exit 1
        fi
        echo "Using Rust toolchain '$channel' from rust-toolchain.toml"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
