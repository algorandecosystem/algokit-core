name: Build Trusty Applet

on:
  push:
    branches: [ "main", "trusty" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Proves the algo25 create/recover/sign flow works, independent of the
  # much heavier AOSP/Trusty build below.
  verify-algo25-crypto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        run: rustup show

      - name: Cache Cargo Registry & Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-verify-algo25-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-verify-algo25-${{ runner.os }}-

      - name: Create & Recover algo25 Account (algokit_crypto)
        run: cargo run -p algokit_crypto --example algo25_roundtrip

      - name: Verify no_std + alloc Compatibility (Trusty/TEE targets)
        run: cargo check -p algokit_crypto --no-default-features

      - name: Test seed_vault (applet protocol + account store logic)
        run: |
          cargo test -p seed_vault
          cargo check -p seed_vault --all-targets

  build-trusty:
    needs: verify-algo25-crypto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 lib32ncurses-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig python3 python3-pip

      - name: Install repo Launcher
        run: |
          # NOT `apt-get install repo`: Ubuntu's packaged launcher lands at
          # /usr/bin/repo, which is root-owned/read-only to the runner user,
          # so every run nags "A new version of repo (...) is available ...
          # The launcher is not writable" and can never actually self-update
          # in place. Installing the official launcher into a writable,
          # user-owned dir (per
          # https://source.android.com/docs/setup/start) fixes that for
          # good: it's the same launcher `repo init`/`repo sync` below
          # bootstrap the *real* repo tool from either way, just able to
          # update itself when it detects a newer version.
          mkdir -p "$HOME/bin"
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Compute Weekly Cache Key
        id: cache-week
        run: echo "week=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Trusty Source Tree (.repo git objects)
        id: repo-cache
        uses: actions/cache@v4
        with:
          # Only `.repo/` (repo's internal bare/mirror git objects for every
          # project in the manifest -- kernel, lib, app, device, prebuilt
          # toolchains, ...) is cached, not the checked-out working trees
          # under trusty-manifest/trusty/*. `repo sync` below always
          # recreates those from `.repo/` (a fast, local-only checkout) --
          # this keeps the cache to roughly half the size for the same
          # speedup, and guarantees a pristine tree every run regardless of
          # what a previous run's "Register seed_vault_ta" step mutated in
          # place.
          path: trusty-manifest/.repo
          # Rotates weekly (rather than a single fixed key) so the cache
          # can't grow unbounded/go permanently stale: each week starts by
          # restoring the *previous* week's objects (via restore-keys, a
          # prefix match) and only has to fetch that week's deltas, then
          # saves a fresh snapshot under the new key. First run of a given
          # week (or the very first run ever) falls back to a full
          # `repo sync` -- still correct, just not accelerated.
          key: trusty-repo-src-${{ steps.cache-week.outputs.week }}
          restore-keys: |
            trusty-repo-src-

      - name: Fetch Trusty Source Tree
        run: |
          # Purely informational: makes a cache-miss (e.g. first run of the
          # week, or after the 10GB/repo GitHub Actions cache quota evicted
          # this entry) obvious from the log/timing rather than a mystery.
          echo "Trusty .repo cache hit: ${{ steps.repo-cache.outputs.cache-hit }}"

          mkdir -p trusty-manifest
          cd trusty-manifest
          repo init -u https://android.googlesource.com/trusty/manifest -b main
          # `-j$(nproc)` parallelizes across projects either way, but with a
          # warm `.repo` cache (see the step above) this only has to fetch
          # commits made *since* the cached snapshot instead of cloning
          # every one of the manifest's ~dozens of git projects from
          # scratch -- by far the slowest part of this workflow otherwise.
          repo sync -j$(nproc)

      - name: Inject Vendored Crates & First-Party Libraries
        run: |
          for crate in cryptoxide base32 signature getrandom; do
            mkdir -p "trusty-manifest/trusty/user/base/lib/${crate}"
            cp -r "trusty/vendor/${crate}/." "trusty-manifest/trusty/user/base/lib/${crate}/"
          done
          for crate in algokit_crypto seed_vault; do
            mkdir -p "trusty-manifest/trusty/user/base/lib/${crate}"
            cp -r "crates/${crate}/." "trusty-manifest/trusty/user/base/lib/${crate}/"
          done

      - name: Inject Custom Trusty Applet
        run: |
          mkdir -p trusty-manifest/trusty/user/app/seed_vault_ta
          cp -r trusty/app/seed_vault_ta/* trusty-manifest/trusty/user/app/seed_vault_ta/

      - name: Register seed_vault_ta as a build module
        run: |
          python3 - <<'PYEOF'
          import pathlib
          import sys

          mk_path = pathlib.Path(
              "trusty-manifest/trusty/device/x86/generic-x86_64/project/generic-x86_64-inc.mk"
          )
          text = mk_path.read_text()
          anchor = "TRUSTY_BUILTIN_USER_TASKS := \\\n"
          app_line = "\ttrusty/user/app/seed_vault_ta \\\n"

          if anchor not in text:
              sys.exit(
                  f"Could not find '{anchor.strip()}' in {mk_path}. "
                  "Upstream Trusty project file format has likely changed -- "
                  "update this step in trusty_ci.yml to match."
              )
          if app_line in text:
              print("seed_vault_ta already registered in TRUSTY_BUILTIN_USER_TASKS")
          else:
              mk_path.write_text(text.replace(anchor, anchor + app_line, 1))
              print(f"Registered seed_vault_ta in TRUSTY_BUILTIN_USER_TASKS ({mk_path})")
          PYEOF

      - name: Build Trusty OS & Applet Binary
        run: |
          cd trusty-manifest
          ./trusty/vendor/google/aosp/scripts/build.py generic-x86_64-test

      - name: Package Binaries
        run: |
          mkdir -p build-output
          find trusty-manifest/build-generic-x86_64-test/ -name "*.elf" -exec cp {} build-output/ \;
          find trusty-manifest/build-generic-x86_64-test/ -name "*.bin" -exec cp {} build-output/ \;

      - name: Upload Build Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: trusty-applet-binaries
          path: build-output/
          retention-days: 14
