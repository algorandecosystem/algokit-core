name: Kotlin/JVM CI

on:
  workflow_call:
    inputs:
      crate:
        description: "Crate name to build the Kotlin/JVM package from"
        required: true
        type: string
      release:
        description: "Whether to build a release version"
        required: true
        type: boolean

env:
  CRATE: ${{ inputs.crate }}
  KOTLIN_PACKAGE_DIR: packages/kotlin/${{ inputs.crate }}

jobs:
  # Builds and tests the native library + Kotlin bindings on each supported desktop
  # platform. Each job only produces a JAR containing the native library for its own
  # host - the `publish` job below downloads all of them and merges them into a
  # single multi-platform JAR before publishing to Maven Central.
  #
  # NOTE: Windows isn't included yet - the build_pkgs Kotlin builder shells out to
  # `sh` to run Gradle, which isn't guaranteed to be on PATH on windows-latest
  # runners. Once that's verified, add a `windows-latest` / `win32-x86-64` entry.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86-64
          - os: macos-latest
            platform: darwin-aarch64
          - os: macos-13
            platform: darwin-x86-64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0

      - name: Build JAR
        run: cargo pkg ${{ env.CRATE }} kotlin

      - name: Host Test
        working-directory: ${{ env.KOTLIN_PACKAGE_DIR }}
        run: ./gradlew test

      - name: Archive native library
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CRATE }}-${{ matrix.platform }}
          path: ${{ env.KOTLIN_PACKAGE_DIR }}/src/main/resources

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0

      - name: Build JAR (generates Kotlin bindings + this host's native library)
        run: cargo pkg ${{ env.CRATE }} kotlin

      - name: Download all platform native libraries
        uses: actions/download-artifact@v6
        with:
          path: ${{ env.KOTLIN_PACKAGE_DIR }}/src/main/resources
          pattern: ${{ env.CRATE }}-*
          merge-multiple: true

      - name: Build multi-platform JAR
        working-directory: ${{ env.KOTLIN_PACKAGE_DIR }}
        run: ./gradlew jar

      - name: Archive Build Output
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CRATE }}.jar
          path: ${{ env.KOTLIN_PACKAGE_DIR }}/build/libs/*.jar

      - name: Build and Publish to Maven Central
        if: ${{ inputs.release }}
        working-directory: ${{ env.KOTLIN_PACKAGE_DIR }}
        env:
          GITHUB_TAG: ${{ github.ref_name }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.RSA_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.RSA_GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          export VERSION_TAG=${GITHUB_TAG#v}  # Remove the leading 'v'
          echo "Publishing version: $VERSION_TAG"
          echo "Publishing to Maven Central (USER_MANAGED - requires manual release)..."
          ./gradlew publishToMavenCentral
