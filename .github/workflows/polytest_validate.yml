name: Polytest Validate

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CRATE: algokit_transact

jobs:
  validate:
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-toolchain-channel
        id: rust-toolchain
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - name: Polytest Validate
        run: cd crates/${{ env.CRATE }}_ffi && cargo bin polytest validate
