[package]
name = "seed_vault_ffi"
version = "0.1.0"
edition = "2024"

# Client-side (non-secure world) bindings for the `seed_vault_ta` Trusty
# applet, packaged for Android as `packages/android/algokit_seed_vault`
# (`cargo pkg seed_vault aar`).
#
# Wraps `seed_vault::protocol` -- the exact encoder/decoder the applet itself
# is built from -- plus the Trusty IPC (TIPC) transport, so an Android app
# never hand-rolls the wire format and can't drift out of sync with the
# applet it talks to.

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
seed_vault = { path = "../seed_vault" }
# The WASM runtime's client side (protocol, manifests, light client
# helpers); its in-process runtime only with the `emulator` feature.
seed_vault_wasm = { path = "../seed_vault_wasm", default-features = false }
uniffi = { workspace = true, features = ["scaffolding-ffi-buffer-fns"] }
zeroize = { workspace = true }

[dev-dependencies]
# Signing test manifests and decoding light-client-poc's sample data in
# tests/emulated.rs.
seed_vault_wasm = { path = "../seed_vault_wasm" }
base64 = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["emulator"]
# `SeedVaultClient::emulated`: the WASM runtime in the app's process, for
# devices without the Trusty applet. Adds wasmi (~1 MB per ABI); build with
# `--no-default-features` for a TA-only library.
emulator = ["seed_vault_wasm/vault"]

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
libc = "0.2.172"

